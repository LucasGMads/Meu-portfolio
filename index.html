<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ClimApp</title>
</head>
<body>
   <header>
    <h1>ClimApp</h1>
    <input type="text" placeholder="Digite o nome da cidade">
    <button>Pesquisar</button>
   </header>
   <main>
    <section>
        <h2>Previsão do Tempo</h2>
        <h3>São Paulo</h3>
        <p>Temperatura: 24°C</p>
        <p>Condição: Ensolarado</p>
        <p>Umidade: 65%</p>
        <p>Velocidade do Vento: 12 km/h</p>
    </section>
    <section>
        <h2>Previsão dos próximos dias</h2>

            <div class="previsao"> 

                <div class="card card1">
                    <h3>Segunda-feira</h3>
                    <p>22°C</p>
                    <p>Nublado</p>
                </div>

                <div class="card card2">
                    <h3>Terça-feira</h3>
                    <p>24°C</p>
                    <p>Ensolarado</p>
                </div>
                <div class="card card3">
                    <h3>Quarta-feira</h3>
                    <p>23°C</p>
                    <p>Chuva</p>
                </div>

                <div class="card card4">
                    <h3>Quinta-feira</h3>
                    <p>25°C</p>
                    <p>Ensolarado</p>
                </div>

            </div>    
    </section>
    </main>
</body>
</html>
